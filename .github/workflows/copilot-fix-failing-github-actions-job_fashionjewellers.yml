# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - fashionjewellers

on:
  push:
    branches:
      - 'copilot/fix-failing-github-actions-job'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fashion_jewellery_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fashion_jewellery_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: fashion_jewellery_db
      DB_SSL: 'false'
      JWT_SECRET: ci-test-secret
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Set up test database
        run: |
          docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d fashion_jewellery_db < db/setup_postgres.sql
          docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d fashion_jewellery_db < server/test/fixtures/ci.sql

      - name: npm install, build, and test
        working-directory: server
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: server

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions: {}
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'fashionjewellers'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_4541CDCC3DEB42BF8E0074F7DDE125A8 }}